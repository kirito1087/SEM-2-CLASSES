<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>

    <header>

      <div class="input-container">

        <input type="text" name="" id="input" placeholder="Enter location..." />
        <button id="butto">Search</button>

      </div>

    </header>

    <main>

      <div class="weather-container">

        <div class="temperature">12.5 °C</div>

        <div class="location-data">

          <div class="location">Delhi</div>

          <span class="time">9:15</span>
          <span class="day">Friday</span>
          <span class="date">2026-01-30</span>

        </div>

        <div class="weather-status">
          <div class="icon">

            <img
              src="https://imgs.search.brave.com/6_WxNZ5rwP8hMMTZBDjt0lIBWvPu3oYLYqShOiJZPlg/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9zdGF0/aWMudmVjdGVlenku/Y29tL3N5c3RlbS9y/ZXNvdXJjZXMvdGh1/bWJuYWlscy8wMjQv/ODI1LzE1NS9zbWFs/bC8zZC13ZWF0aGVy/LWljb24tc3VuLWFu/ZC13aW5kLWZyZWUt/cG5nLnBuZw"
              alt="weather-status-icon"
            />

          </div>
        </div>
      </div>
    </main>

    <div class="waifu-bubble" id="waifuBubble">
      <div class="waifu-bubble-text">Hello! 🌤️</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
